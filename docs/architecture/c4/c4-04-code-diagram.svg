<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 880" width="100%" height="100%" font-family="Segoe UI, Consolas, monospace, sans-serif">
  <defs>
    <marker id="uml-arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M 0 0 L 12 5 L 0 10" fill="none" stroke="#222222" stroke-width="1.8"/>
    </marker>
    <marker id="uml-inherit" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto">
      <polygon points="0 0, 14 6, 0 12" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
    </marker>
  </defs>

  <rect width="1360" height="880" fill="#ffffff"/>

  <!-- Top External Exception Box: DomainException -->
  <rect x="815" y="35" width="260" height="58" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="945" y="56" text-anchor="middle" font-size="11.5" font-style="italic" fill="#444444">&lt;&lt;RuntimeException&gt;&gt;</text>
  <text x="945" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">DomainException</text>

  <!-- Package Frame -->
  <path d="M 55 100 L 460 100 L 460 125 L 55 125 Z" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <rect x="55" y="125" width="1250" height="625" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="680" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">br.com.fiap.soat.oficina.application.usecase.ordemservico &amp; domain</text>

  <!-- Interface Lollipop: OrdemServicoRepositoryPort / PecaRepositoryPort -->
  <circle cx="570" cy="185" r="14" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="570" y="218" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111111">OrdemServicoRepositoryPort / PecaRepositoryPort</text>
  <line x1="570" y1="226" x2="570" y2="255" stroke="#222222" stroke-width="2"/>

  <!-- Central Class: AprovarOrcamentoUseCase (x=370..770, y=255..385) -->
  <rect x="370" y="255" width="400" height="130" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="570" y="275" text-anchor="middle" font-size="11" font-style="italic" fill="#444444">&lt;&lt;UseCase&gt;&gt;</text>
  <text x="570" y="293" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">AprovarOrcamentoUseCase</text>
  <line x1="370" y1="302" x2="770" y2="302" stroke="#222222" stroke-width="1.5"/>
  <text x="384" y="321" font-size="11.5" font-family="Consolas, monospace" fill="#222222">- osRepository: OrdemServicoRepositoryPort</text>
  <text x="384" y="339" font-size="11.5" font-family="Consolas, monospace" fill="#222222">- pecaRepository: PecaRepositoryPort</text>
  <line x1="370" y1="348" x2="770" y2="348" stroke="#222222" stroke-width="1.5"/>
  <text x="384" y="370" font-size="11.5" font-family="Consolas, monospace" fill="#111111">+ executar(ordemServicoId: UUID): OrdemServicoOutput</text>

  <!-- Right Class: SaldoEstoqueInsuficienteException / TransicaoStatusInvalidaException (x=835..1280, y=260..380) -->
  <rect x="835" y="260" width="445" height="120" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="1057" y="280" text-anchor="middle" font-size="11" font-style="italic" fill="#444444">&lt;&lt;DomainException&gt;&gt;</text>
  <text x="1057" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">SaldoEstoqueInsuficienteException / TransicaoStatusInvalidaException</text>
  <line x1="835" y1="308" x2="1280" y2="308" stroke="#222222" stroke-width="1.5"/>
  <text x="847" y="332" font-size="11" font-family="Consolas, monospace" fill="#222222">+ SaldoEstoqueInsuficienteException(nomePeca, saldo, solicitado)</text>
  <text x="847" y="354" font-size="11" font-family="Consolas, monospace" fill="#222222">+ TransicaoStatusInvalidaException(statusAtual, statusDestino)</text>

  <!-- Left Class: OrdemServicoOutput (DTO) (x=75..415, y=455..585) -->
  <rect x="75" y="455" width="340" height="130" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="245" y="475" text-anchor="middle" font-size="11" font-style="italic" fill="#444444">&lt;&lt;Java Record DTO&gt;&gt;</text>
  <text x="245" y="492" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111111">OrdemServicoOutput</text>
  <line x1="75" y1="500" x2="415" y2="500" stroke="#222222" stroke-width="1.5"/>
  <text x="88" y="518" font-size="11" font-family="Consolas, monospace" fill="#222222">+ id: UUID</text>
  <text x="88" y="534" font-size="11" font-family="Consolas, monospace" fill="#222222">+ status: StatusOS</text>
  <text x="88" y="550" font-size="11" font-family="Consolas, monospace" fill="#222222">+ valorTotal: BigDecimal</text>
  <line x1="75" y1="558" x2="415" y2="558" stroke="#222222" stroke-width="1.5"/>
  <text x="88" y="576" font-size="10.5" font-family="Consolas, monospace" fill="#111111">+ fromDomain(os: OrdemServico): OrdemServicoOutput</text>

  <!-- Bottom Center Class: OrdemServico (Aggregate Root) (x=445..765, y=475..640) -->
  <rect x="445" y="475" width="320" height="165" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="605" y="494" text-anchor="middle" font-size="11" font-style="italic" fill="#444444">&lt;&lt;Aggregate Root&gt;&gt;</text>
  <text x="605" y="511" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">OrdemServico</text>
  <line x1="445" y1="520" x2="765" y2="520" stroke="#222222" stroke-width="1.5"/>
  <text x="458" y="538" font-size="11" font-family="Consolas, monospace" fill="#222222">- id: UUID</text>
  <text x="458" y="554" font-size="11" font-family="Consolas, monospace" fill="#222222">- status: StatusOS</text>
  <text x="458" y="570" font-size="11" font-family="Consolas, monospace" fill="#222222">- itensPeca: List&lt;ItemPecaOrdem&gt;</text>
  <line x1="445" y1="580" x2="765" y2="580" stroke="#222222" stroke-width="1.5"/>
  <text x="458" y="598" font-size="11" font-family="Consolas, monospace" fill="#111111">+ aprovar(): void</text>
  <text x="458" y="614" font-size="11" font-family="Consolas, monospace" fill="#111111">+ rejeitar(): void</text>
  <text x="458" y="630" font-size="11" font-family="Consolas, monospace" fill="#111111">+ calcularValorTotal(): Dinheiro</text>

  <!-- Bottom Right Class: Peca (Aggregate Root) (x=835..1175, y=475..640) -->
  <rect x="835" y="475" width="340" height="165" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="1005" y="494" text-anchor="middle" font-size="11" font-style="italic" fill="#444444">&lt;&lt;Aggregate Root&gt;&gt;</text>
  <text x="1005" y="511" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Peca</text>
  <line x1="835" y1="520" x2="1175" y2="520" stroke="#222222" stroke-width="1.5"/>
  <text x="848" y="538" font-size="11" font-family="Consolas, monospace" fill="#222222">- id: UUID</text>
  <text x="848" y="554" font-size="11" font-family="Consolas, monospace" fill="#222222">- saldoEstoque: Integer</text>
  <text x="848" y="570" font-size="11" font-family="Consolas, monospace" fill="#222222">- precoUnitario: Dinheiro</text>
  <line x1="835" y1="582" x2="1175" y2="582" stroke="#222222" stroke-width="1.5"/>
  <text x="848" y="602" font-size="11" font-family="Consolas, monospace" fill="#111111">+ debitarEstoque(quantidade: int): void</text>
  <text x="848" y="620" font-size="11" font-family="Consolas, monospace" fill="#111111">+ creditarEstoque(quantidade: int): void</text>

  <!-- Bottom Value Object: StatusOS & Dinheiro (y=670..740) -->
  <rect x="445" y="670" width="320" height="68" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
  <text x="605" y="686" text-anchor="middle" font-size="10.5" font-style="italic" fill="#444444">&lt;&lt;Value Object / Enum&gt;&gt;</text>
  <text x="605" y="701" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111111">StatusOS</text>
  <line x1="445" y1="707" x2="765" y2="707" stroke="#222222" stroke-width="1.2"/>
  <text x="458" y="726" font-size="10.5" font-family="Consolas, monospace" fill="#222222">+ podeTransicionarPara(destino): boolean</text>

  <rect x="835" y="670" width="340" height="68" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
  <text x="1005" y="686" text-anchor="middle" font-size="10.5" font-style="italic" fill="#444444">&lt;&lt;Value Object (Record)&gt;&gt;</text>
  <text x="1005" y="701" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111111">Dinheiro</text>
  <line x1="835" y1="707" x2="1175" y2="707" stroke="#222222" stroke-width="1.2"/>
  <text x="848" y="726" font-size="10.5" font-family="Consolas, monospace" fill="#222222">+ valor: BigDecimal | + somar(outro): Dinheiro</text>

  <!-- UML Connectors -->
  <!-- Inheritance: DomainException <- SaldoEstoqueInsuficienteException -->
  <line x1="945" y1="260" x2="945" y2="95" stroke="#222222" stroke-width="1.8" marker-end="url(#uml-inherit)"/>

  <!-- Dependency: AprovarOrcamentoUseCase ..> SaldoEstoqueInsuficienteException (+throws) -->
  <line x1="770" y1="320" x2="833" y2="320" stroke="#222222" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#uml-arrow)"/>
  <text x="801" y="312" text-anchor="middle" font-size="11" fill="#222222">+throws</text>

  <!-- Association: AprovarOrcamentoUseCase -> OrdemServicoOutput (+creates) -->
  <line x1="420" y1="385" x2="310" y2="453" stroke="#222222" stroke-width="1.6" marker-end="url(#uml-arrow)"/>
  <text x="335" y="415" text-anchor="middle" font-size="11" fill="#222222">+creates</text>

  <!-- Association: AprovarOrcamentoUseCase -> OrdemServico (+uses) -->
  <line x1="570" y1="385" x2="570" y2="473" stroke="#222222" stroke-width="1.6" marker-end="url(#uml-arrow)"/>
  <text x="595" y="432" text-anchor="middle" font-size="11" fill="#222222">+uses</text>

  <!-- Association: AprovarOrcamentoUseCase -> Peca (+debits stock) -->
  <line x1="690" y1="385" x2="910" y2="473" stroke="#222222" stroke-width="1.6" marker-end="url(#uml-arrow)"/>
  <text x="845" y="425" text-anchor="middle" font-size="11" fill="#222222">+debits stock</text>

  <!-- Association: OrdemServico -> StatusOS -->
  <line x1="605" y1="640" x2="605" y2="668" stroke="#222222" stroke-width="1.6" marker-end="url(#uml-arrow)"/>
  <text x="655" y="658" text-anchor="middle" font-size="10.5" fill="#222222">+validates state</text>

  <!-- Association: Peca -> Dinheiro -->
  <line x1="1005" y1="640" x2="1005" y2="668" stroke="#222222" stroke-width="1.6" marker-end="url(#uml-arrow)"/>
  <text x="1032" y="658" text-anchor="middle" font-size="10.5" fill="#222222">+uses</text>

  <!-- Title Footer -->
  <text x="55" y="795" font-size="18" font-weight="bold" fill="#111111">[Code] Sistema de Gestão de Oficina Mecânica - AprovarOrcamentoUseCase &amp; Agregados</text>
  <text x="55" y="815" font-size="12.5" fill="#666666">Diagrama de Código UML (Nível 4 - C4 Model)</text>
</svg>