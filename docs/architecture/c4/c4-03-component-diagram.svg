<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1020" width="100%" height="100%" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="c4-arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <polygon points="0 0, 12 5, 0 10" fill="#666666"/>
    </marker>
    <filter id="shadow" x="-3%" y="-3%" width="108%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1440" height="1020" fill="#ffffff"/>

  <!-- Top External Callers (y=35..155) -->
  <g filter="url(#shadow)">
    <rect x="80" y="35" width="320" height="120" rx="6" fill="#d93829" stroke="#9e2217" stroke-width="2"/>
    <text x="240" y="68" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Cliente Público / Consulta OS</text>
    <text x="240" y="85" text-anchor="middle" font-size="11" fill="#fecaca">[External Caller: HTTP Client]</text>
    <text x="240" y="110" text-anchor="middle" font-size="11.5" fill="#ffffff">Consulta andamento da OS e envia</text>
    <text x="240" y="126" text-anchor="middle" font-size="11.5" fill="#ffffff">decisão de aprovação ou rejeição</text>
    <text x="240" y="142" text-anchor="middle" font-size="11.5" fill="#ffffff">sem expor dados pessoais (LGPD).</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="680" y="35" width="420" height="120" rx="6" fill="#d93829" stroke="#9e2217" stroke-width="2"/>
    <text x="890" y="68" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Painel Operacional / Swagger UI</text>
    <text x="890" y="85" text-anchor="middle" font-size="11" fill="#fecaca">[Container: Web UI / REST Client]</text>
    <text x="890" y="112" text-anchor="middle" font-size="11.5" fill="#ffffff">Interface utilizada por Atendentes,</text>
    <text x="890" y="128" text-anchor="middle" font-size="11.5" fill="#ffffff">Mecânicos e Administradores com</text>
    <text x="890" y="144" text-anchor="middle" font-size="11.5" fill="#ffffff">autenticação Bearer JWT.</text>
  </g>

  <!-- Container Boundary: API Application (Oficina API) (x=50..1390, y=235..820) -->
  <rect x="50" y="235" width="1340" height="585" fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="10,6" rx="4"/>
  <text x="72" y="792" font-size="13.5" font-weight="bold" fill="#333333">API Application (Oficina API - Clean Architecture)</text>
  <text x="72" y="808" font-size="11" fill="#666666">[Container: Java 21 &amp; Spring Boot 3.3.4]</text>

  <!-- ROW 1: PRESENTATION CONTROLLERS (y=265..395) -->
  <g filter="url(#shadow)">
    <rect x="80" y="265" width="290" height="130" rx="6" fill="#e05343" stroke="#a83225" stroke-width="2"/>
    <text x="225" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">OrdemServicoPublicController</text>
    <text x="225" y="312" text-anchor="middle" font-size="10.5" fill="#fee2e2">[Component: Spring MVC Rest Controller]</text>
    <text x="225" y="336" text-anchor="middle" font-size="11" fill="#ffffff">Expõe endpoints públicos (/public/...)</text>
    <text x="225" y="352" text-anchor="middle" font-size="11" fill="#ffffff">para consulta de status, aprovação</text>
    <text x="225" y="368" text-anchor="middle" font-size="11" fill="#ffffff">e rejeição de orçamento.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="410" y="265" width="290" height="130" rx="6" fill="#e05343" stroke="#a83225" stroke-width="2"/>
    <text x="555" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">OrdemServicoAdminController</text>
    <text x="555" y="312" text-anchor="middle" font-size="10.5" fill="#fee2e2">[Component: Spring MVC Rest Controller]</text>
    <text x="555" y="336" text-anchor="middle" font-size="11" fill="#ffffff">Gerencia abertura de OS, início de</text>
    <text x="555" y="352" text-anchor="middle" font-size="11" fill="#ffffff">diagnóstico, inclusão de itens,</text>
    <text x="555" y="368" text-anchor="middle" font-size="11" fill="#ffffff">finalização, entrega e listagem.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="740" y="265" width="290" height="130" rx="6" fill="#e05343" stroke="#a83225" stroke-width="2"/>
    <text x="885" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Cliente &amp; Veiculo Controllers</text>
    <text x="885" y="312" text-anchor="middle" font-size="10.5" fill="#fee2e2">[Component: Spring MVC Rest Controller]</text>
    <text x="885" y="336" text-anchor="middle" font-size="11" fill="#ffffff">CRUD e busca de Clientes por</text>
    <text x="885" y="352" text-anchor="middle" font-size="11" fill="#ffffff">CPF/CNPJ e Veículos por Placa</text>
    <text x="885" y="368" text-anchor="middle" font-size="11" fill="#ffffff">(Mercosul / Tradicional).</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1070" y="265" width="290" height="130" rx="6" fill="#e05343" stroke="#a83225" stroke-width="2"/>
    <text x="1215" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Peca, Servico &amp; Auth Controllers</text>
    <text x="1215" y="312" text-anchor="middle" font-size="10.5" fill="#fee2e2">[Component: Spring MVC Rest Controller]</text>
    <text x="1215" y="336" text-anchor="middle" font-size="11" fill="#ffffff">Autenticação JWT, catálogo de</text>
    <text x="1215" y="352" text-anchor="middle" font-size="11" fill="#ffffff">serviços, controle de estoque de</text>
    <text x="1215" y="368" text-anchor="middle" font-size="11" fill="#ffffff">peças e cálculo de tempo médio.</text>
  </g>

  <!-- ROW 2: APPLICATION USE CASES (y=450..580) -->
  <g filter="url(#shadow)">
    <rect x="80" y="450" width="290" height="130" rx="6" fill="#e05343" stroke="#a83225" stroke-width="2"/>
    <text x="225" y="480" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Orçamento &amp; Consulta Use Cases</text>
    <text x="225" y="497" text-anchor="middle" font-size="10.5" fill="#fee2e2">[Component: Application Use Cases (Pure Java)]</text>
    <text x="225" y="521" text-anchor="middle" font-size="11" fill="#ffffff">ConsultarStatusOSUseCase e</text>
    <text x="225" y="537" text-anchor="middle" font-size="11" fill="#ffffff">AprovarOrcamentoUseCase (baixa</text>
    <text x="225" y="553" text-anchor="middle" font-size="11" fill="#ffffff">atômica @Transactional de peças).</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="410" y="450" width="290" height="130" rx="6" fill="#e05343" stroke="#a83225" stroke-width="2"/>
    <text x="555" y="480" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Ciclo de Vida da OS Use Cases</text>
    <text x="555" y="497" text-anchor="middle" font-size="10.5" fill="#fee2e2">[Component: Application Use Cases (Pure Java)]</text>
    <text x="555" y="521" text-anchor="middle" font-size="11" fill="#ffffff">CriarOrdemServicoUseCase,</text>
    <text x="555" y="537" text-anchor="middle" font-size="11" fill="#ffffff">AdicionarItensOSUseCase e</text>
    <text x="555" y="553" text-anchor="middle" font-size="11" fill="#ffffff">AtualizarStatusOSUseCase.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="740" y="450" width="290" height="130" rx="6" fill="#e05343" stroke="#a83225" stroke-width="2"/>
    <text x="885" y="480" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Cadastros &amp; Estoque Use Cases</text>
    <text x="885" y="497" text-anchor="middle" font-size="10.5" fill="#fee2e2">[Component: Application Use Cases (Pure Java)]</text>
    <text x="885" y="521" text-anchor="middle" font-size="11" fill="#ffffff">Casos de uso de Cliente, Veículo,</text>
    <text x="885" y="537" text-anchor="middle" font-size="11" fill="#ffffff">Serviço, Estoque de Peças e</text>
    <text x="885" y="553" text-anchor="middle" font-size="11" fill="#ffffff">CalcularTempoMedioExecucaoUseCase.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1070" y="450" width="290" height="130" rx="6" fill="#e05343" stroke="#a83225" stroke-width="2"/>
    <text x="1215" y="480" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Security &amp; Exception Component</text>
    <text x="1215" y="497" text-anchor="middle" font-size="10.5" fill="#fee2e2">[Component: Spring Security 6 &amp; RFC 7807]</text>
    <text x="1215" y="521" text-anchor="middle" font-size="11" fill="#ffffff">JwtAuthenticationFilter, JwtService,</text>
    <text x="1215" y="537" text-anchor="middle" font-size="11" fill="#ffffff">SecurityConfig (RBAC) e</text>
    <text x="1215" y="553" text-anchor="middle" font-size="11" fill="#ffffff">GlobalExceptionHandler.</text>
  </g>

  <!-- ROW 3: DOMAIN CORE (x=100..540) & PERSISTENCE ADAPTERS (x=820..1290) -> 280px GAP! (y=645..765) -->
  <g filter="url(#shadow)">
    <rect x="100" y="645" width="440" height="120" rx="6" fill="#e05343" stroke="#a83225" stroke-width="2"/>
    <text x="320" y="675" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#ffffff">Núcleo de Domínio Puro (Aggregates, Entities, VOs &amp; Ports)</text>
    <text x="320" y="692" text-anchor="middle" font-size="10.5" fill="#fee2e2">[Component: Pure Java 21 Domain Layer (Zero Frameworks)]</text>
    <text x="320" y="715" text-anchor="middle" font-size="11" fill="#ffffff">Agregados: OrdemServico, Cliente, Veiculo, Peca, Servico.</text>
    <text x="320" y="731" text-anchor="middle" font-size="11" fill="#ffffff">Value Objects: StatusOS, Dinheiro, CpfCnpj, Placa.</text>
    <text x="320" y="747" text-anchor="middle" font-size="11" fill="#ffffff">Interfaces de saída: *RepositoryPort.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="820" y="645" width="470" height="120" rx="6" fill="#e05343" stroke="#a83225" stroke-width="2"/>
    <text x="1055" y="675" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#ffffff">Persistence Adapters, JPA Repositories &amp; Mappers</text>
    <text x="1055" y="692" text-anchor="middle" font-size="10.5" fill="#fee2e2">[Component: Infrastructure Persistence Layer (Spring Data JPA)]</text>
    <text x="1055" y="715" text-anchor="middle" font-size="11" fill="#ffffff">Implementa as portas de repositório do domínio (OrdemServicoRepositoryAdapter,</text>
    <text x="1055" y="731" text-anchor="middle" font-size="11" fill="#ffffff">ClienteRepositoryAdapter, PecaRepositoryAdapter, etc.) e converte JPA &lt;-&gt; Domínio.</text>
  </g>

  <!-- External Database Cylinder at Bottom Right (x=875..1235, y=855..975) -->
  <g filter="url(#shadow)">
    <path d="M 875 875 L 875 955 A 180 18 0 0 0 1235 955 L 1235 875 Z" fill="#c92a1d" stroke="#8f1910" stroke-width="2"/>
    <ellipse cx="1055" cy="875" rx="180" ry="18" fill="#db3b2c" stroke="#8f1910" stroke-width="2"/>
    <text x="1055" y="908" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#ffffff">Database (PostgreSQL 16)</text>
    <text x="1055" y="924" text-anchor="middle" font-size="10.5" fill="#fecaca">[Container: PostgreSQL 16 Database Schema]</text>
    <text x="1055" y="945" text-anchor="middle" font-size="11" fill="#ffffff">Tabelas: clientes, veiculos, servicos, pecas,</text>
    <text x="1055" y="960" text-anchor="middle" font-size="11" fill="#ffffff">ordens_servico, os_itens_servico, os_itens_peca.</text>
  </g>

  <!-- Relationships -->
  <!-- Top Callers -> Controllers -->
  <line x1="225" y1="155" x2="225" y2="258" stroke="#666666" stroke-width="2" stroke-dasharray="8,6" marker-end="url(#c4-arrow)"/>
  <rect x="150" y="182" width="150" height="36" fill="#ffffff" rx="4"/>
  <text x="225" y="197" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333333">Makes API calls to</text>
  <text x="225" y="211" text-anchor="middle" font-size="9.5" fill="#666666">[JSON/HTTPS]</text>

  <line x1="740" y1="155" x2="555" y2="258" stroke="#666666" stroke-width="2" stroke-dasharray="8,6" marker-end="url(#c4-arrow)"/>
  <rect x="555" y="182" width="145" height="36" fill="#ffffff" rx="4"/>
  <text x="627" y="197" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333333">Makes API calls to</text>
  <text x="627" y="211" text-anchor="middle" font-size="9.5" fill="#666666">[JSON/HTTPS (JWT)]</text>

  <line x1="885" y1="155" x2="885" y2="258" stroke="#666666" stroke-width="2" stroke-dasharray="8,6" marker-end="url(#c4-arrow)"/>
  <rect x="812" y="182" width="145" height="36" fill="#ffffff" rx="4"/>
  <text x="885" y="197" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333333">Makes API calls to</text>
  <text x="885" y="211" text-anchor="middle" font-size="9.5" fill="#666666">[JSON/HTTPS (JWT)]</text>

  <line x1="1030" y1="155" x2="1215" y2="258" stroke="#666666" stroke-width="2" stroke-dasharray="8,6" marker-end="url(#c4-arrow)"/>
  <rect x="1065" y="182" width="145" height="36" fill="#ffffff" rx="4"/>
  <text x="1137" y="197" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333333">Makes API calls to</text>
  <text x="1137" y="211" text-anchor="middle" font-size="9.5" fill="#666666">[JSON/HTTPS (JWT)]</text>

  <!-- Controllers -> Use Cases -->
  <line x1="225" y1="395" x2="225" y2="443" stroke="#666666" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#c4-arrow)"/>
  <rect x="200" y="407" width="50" height="20" fill="#ffffff" rx="3"/>
  <text x="225" y="421" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333333">Uses</text>

  <line x1="555" y1="395" x2="555" y2="443" stroke="#666666" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#c4-arrow)"/>
  <rect x="530" y="407" width="50" height="20" fill="#ffffff" rx="3"/>
  <text x="555" y="421" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333333">Uses</text>

  <line x1="885" y1="395" x2="885" y2="443" stroke="#666666" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#c4-arrow)"/>
  <rect x="860" y="407" width="50" height="20" fill="#ffffff" rx="3"/>
  <text x="885" y="421" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333333">Uses</text>

  <line x1="1215" y1="395" x2="1215" y2="443" stroke="#666666" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#c4-arrow)"/>
  <rect x="1190" y="407" width="50" height="20" fill="#ffffff" rx="3"/>
  <text x="1215" y="421" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333333">Uses</text>

  <!-- Use Cases -> Domain Core -->
  <line x1="225" y1="580" x2="260" y2="638" stroke="#666666" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#c4-arrow)"/>
  <rect x="165" y="596" width="140" height="22" fill="#ffffff" rx="3"/>
  <text x="235" y="611" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333333">Executes domain logic on</text>

  <line x1="555" y1="580" x2="380" y2="638" stroke="#666666" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#c4-arrow)"/>
  <rect x="405" y="596" width="140" height="22" fill="#ffffff" rx="3"/>
  <text x="475" y="611" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333333">Executes domain logic on</text>

  <line x1="885" y1="580" x2="490" y2="638" stroke="#666666" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#c4-arrow)"/>
  <rect x="640" y="596" width="140" height="22" fill="#ffffff" rx="3"/>
  <text x="710" y="611" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333333">Executes domain logic on</text>

  <!-- Persistence Adapters -> Domain Core (280px Gap: x=540..820) -->
  <line x1="820" y1="705" x2="548" y2="705" stroke="#666666" stroke-width="2" stroke-dasharray="8,6" marker-end="url(#c4-arrow)"/>
  <rect x="595" y="683" width="180" height="38" fill="#ffffff" rx="4"/>
  <text x="685" y="699" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333333">Implements Domain Ports</text>
  <text x="685" y="713" text-anchor="middle" font-size="9.5" fill="#666666">[Dependency Inversion]</text>

  <!-- Persistence Adapters -> Database -->
  <line x1="1055" y1="765" x2="1055" y2="850" stroke="#666666" stroke-width="2" stroke-dasharray="8,6" marker-end="url(#c4-arrow)"/>
  <rect x="970" y="788" width="170" height="36" fill="#ffffff" rx="4"/>
  <text x="1055" y="803" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333333">Reads from and writes to</text>
  <text x="1055" y="817" text-anchor="middle" font-size="9.5" fill="#666666">[JDBC / Spring Data JPA]</text>

  <!-- Title Footer -->
  <text x="50" y="955" font-size="18" font-weight="bold" fill="#111111">[Component] Sistema de Gestão de Oficina Mecânica - API Application</text>
  <text x="50" y="975" font-size="12.5" fill="#666666">Diagrama de Componentes (Nível 3 - C4 Model)</text>
</svg>