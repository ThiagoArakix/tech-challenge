<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="100%" height="100%" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="seq-arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#0f172a"/>
    </marker>
    <marker id="seq-ret" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#0284c7"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="#f8fafc" rx="10"/>
  <text x="600" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Diagrama de Sequência 4.1 — Criação da OS, Diagnóstico e Orçamento Automático</text>

  <!-- Lifelines -->
  <g font-size="11.5" font-weight="bold" text-anchor="middle">
    <rect x="35" y="55" width="130" height="36" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="100" y="78" fill="#78350f">Atendente / Mecânico</text>
    <line x1="100" y1="91" x2="100" y2="550" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,5"/>

    <rect x="235" y="55" width="170" height="36" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="320" y="78" fill="#0c4a6e">OrdemServicoAdminCtrl</text>
    <line x1="320" y1="91" x2="320" y2="550" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,5"/>

    <rect x="465" y="55" width="190" height="36" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="560" y="78" fill="#0c4a6e">UseCases (Criar / Itens / Status)</text>
    <line x1="560" y1="91" x2="560" y2="550" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,5"/>

    <rect x="720" y="55" width="170" height="36" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="805" y="78" fill="#78350f">Aggregate: OrdemServico</text>
    <line x1="805" y1="91" x2="805" y2="550" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,5"/>

    <rect x="965" y="55" width="190" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="1060" y="78" fill="#14532d">PostgreSQL (Repositories)</text>
    <line x1="1060" y1="91" x2="1060" y2="550" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,5"/>
  </g>

  <!-- Step 1: Abrir OS -->
  <g font-size="10.5">
    <line x1="100" y1="125" x2="315" y2="125" stroke="#0f172a" stroke-width="1.5" marker-end="url(#seq-arr)"/>
    <text x="207" y="119" text-anchor="middle" font-weight="bold">1. POST /api/v1/ordens-servico</text>
    <line x1="320" y1="145" x2="555" y2="145" stroke="#0f172a" stroke-width="1.5" marker-end="url(#seq-arr)"/>
    <text x="437" y="139" text-anchor="middle">2. CriarOrdemServicoUseCase.executar()</text>
    <line x1="560" y1="165" x2="1055" y2="165" stroke="#0f172a" stroke-width="1.5" marker-end="url(#seq-arr)"/>
    <text x="807" y="159" text-anchor="middle">3. Valida Cliente e Titularidade do Veículo (clienteId == veiculo.clienteId)</text>
    <line x1="560" y1="190" x2="800" y2="190" stroke="#0f172a" stroke-width="1.5" marker-end="url(#seq-arr)"/>
    <text x="680" y="184" text-anchor="middle" font-weight="bold" fill="#b45309">4. OrdemServico.abrir() [Status = RECEBIDA]</text>
    <line x1="560" y1="215" x2="1055" y2="215" stroke="#0f172a" stroke-width="1.5" marker-end="url(#seq-arr)"/>
    <text x="807" y="209" text-anchor="middle">5. salvar(OrdemServico)</text>
    <line x1="320" y1="235" x2="105" y2="235" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#seq-ret)"/>
    <text x="207" y="229" text-anchor="middle" fill="#0369a1">6. 201 Created (OrdemServicoOutput)</text>

    <!-- Step 2: Iniciar e Registrar Diagnóstico -->
    <line x1="100" y1="275" x2="315" y2="275" stroke="#0f172a" stroke-width="1.5" marker-end="url(#seq-arr)"/>
    <text x="207" y="269" text-anchor="middle" font-weight="bold">7. POST /{id}/iniciar-diagnostico &amp; PATCH /diagnostico</text>
    <line x1="320" y1="295" x2="800" y2="295" stroke="#0f172a" stroke-width="1.5" marker-end="url(#seq-arr)"/>
    <text x="560" y="289" text-anchor="middle" font-weight="bold" fill="#b45309">8. os.iniciarDiagnostico() [EM_DIAGNOSTICO] + os.registrarDiagnostico()</text>

    <!-- Step 3: Adicionar Serviços e Peças -->
    <line x1="100" y1="345" x2="315" y2="345" stroke="#0f172a" stroke-width="1.5" marker-end="url(#seq-arr)"/>
    <text x="207" y="339" text-anchor="middle" font-weight="bold">9. POST /{id}/itens/servicos &amp; POST /{id}/itens/pecas</text>
    <line x1="320" y1="365" x2="555" y2="365" stroke="#0f172a" stroke-width="1.5" marker-end="url(#seq-arr)"/>
    <text x="437" y="359" text-anchor="middle">10. AdicionarItensOSUseCase (valida saldoEstoque &gt;= qtd)</text>
    <line x1="560" y1="390" x2="800" y2="390" stroke="#0f172a" stroke-width="1.5" marker-end="url(#seq-arr)"/>
    <text x="680" y="384" text-anchor="middle" font-weight="bold" fill="#15803d">11. adicionarItem*() + calcularValorTotal() Automático (Dinheiro)</text>
    <line x1="560" y1="415" x2="1055" y2="415" stroke="#0f172a" stroke-width="1.5" marker-end="url(#seq-arr)"/>
    <text x="807" y="409" text-anchor="middle">12. salvar(os com itens e orçamento atualizado)</text>

    <!-- Step 4: Submeter para Aprovação -->
    <line x1="100" y1="465" x2="315" y2="465" stroke="#0f172a" stroke-width="1.5" marker-end="url(#seq-arr)"/>
    <text x="207" y="459" text-anchor="middle" font-weight="bold">13. POST /{id}/submeter-aprovacao</text>
    <line x1="320" y1="490" x2="800" y2="490" stroke="#0f172a" stroke-width="1.5" marker-end="url(#seq-arr)"/>
    <text x="560" y="484" text-anchor="middle" font-weight="bold" fill="#6b21a8">14. os.aguardarAprovacao() [AGUARDANDO_APROVACAO — congela itens]</text>
    <line x1="320" y1="520" x2="105" y2="520" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#seq-ret)"/>
    <text x="207" y="514" text-anchor="middle" fill="#0369a1">15. 200 OK (Orçamento disponível para decisão do Cliente)</text>
  </g>
</svg>