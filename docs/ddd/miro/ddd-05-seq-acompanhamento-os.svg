<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="100%" height="100%" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="seq-arr2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#0f172a"/>
    </marker>
    <marker id="seq-ret2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="#f8fafc" rx="10"/>
  <text x="600" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Diagrama de Sequência 4.2 — Consulta Pública (LGPD), Aprovação ACID, Execução e Entrega</text>

  <!-- Lifelines -->
  <g font-size="11.5" font-weight="bold" text-anchor="middle">
    <rect x="30" y="55" width="120" height="36" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="90" y="78" fill="#78350f">Cliente / Mecânico</text>
    <line x1="90" y1="91" x2="90" y2="550" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,5"/>

    <rect x="210" y="55" width="175" height="36" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="297" y="78" fill="#0c4a6e">Public &amp; Admin Controllers</text>
    <line x1="297" y1="91" x2="297" y2="550" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,5"/>

    <rect x="445" y="55" width="185" height="36" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="537" y="78" fill="#0c4a6e">AprovarOrcamentoUseCase</text>
    <line x1="537" y1="91" x2="537" y2="550" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,5"/>

    <rect x="690" y="55" width="210" height="36" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="795" y="78" fill="#78350f">Aggregates: Peca &amp; OrdemServico</text>
    <line x1="795" y1="91" x2="795" y2="550" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,5"/>

    <rect x="965" y="55" width="190" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="1060" y="78" fill="#14532d">PostgreSQL (@Transactional)</text>
    <line x1="1060" y1="91" x2="1060" y2="550" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,5"/>
  </g>

  <g font-size="10.5">
    <!-- Consulta Pública -->
    <line x1="90" y1="125" x2="292" y2="125" stroke="#0f172a" stroke-width="1.5" marker-end="url(#seq-arr2)"/>
    <text x="191" y="119" text-anchor="middle" font-weight="bold">1. GET /api/v1/public/ordens-servico/{id}/status</text>
    <line x1="297" y1="150" x2="95" y2="150" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#seq-ret2)"/>
    <text x="195" y="144" text-anchor="middle" fill="#15803d">2. 200 OK (StatusOSOutput — Orçamento detalhado sem PII/LGPD)</text>

    <!-- Bloco Transacional Aprovação -->
    <rect x="420" y="175" width="665" height="150" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="752" y="193" text-anchor="middle" font-weight="bold" fill="#14532d">[Transação Atômica ACID — @Transactional AprovarOrcamentoUseCase]</text>

    <line x1="90" y1="210" x2="292" y2="210" stroke="#0f172a" stroke-width="1.5" marker-end="url(#seq-arr2)"/>
    <text x="191" y="204" text-anchor="middle" font-weight="bold">3. POST /api/v1/public/ordens-servico/{id}/aprovar</text>
    <line x1="297" y1="230" x2="532" y2="230" stroke="#0f172a" stroke-width="1.5" marker-end="url(#seq-arr2)"/>
    <text x="415" y="224" text-anchor="middle">4. executar(osId)</text>
    <line x1="537" y1="255" x2="790" y2="255" stroke="#0f172a" stroke-width="1.5" marker-end="url(#seq-arr2)"/>
    <text x="663" y="249" text-anchor="middle" font-weight="bold" fill="#b45309">5. Para cada ItemPeca: peca.debitarEstoque(qtd)</text>
    <line x1="537" y1="280" x2="790" y2="280" stroke="#0f172a" stroke-width="1.5" marker-end="url(#seq-arr2)"/>
    <text x="663" y="274" text-anchor="middle" font-weight="bold" fill="#15803d">6. os.aprovar() [Status = EM_EXECUCAO, grava dataAprovacao]</text>
    <line x1="537" y1="308" x2="1055" y2="308" stroke="#0f172a" stroke-width="1.5" marker-end="url(#seq-arr2)"/>
    <text x="795" y="302" text-anchor="middle">7. Commit atômico: salvar(pecas) + salvar(os)</text>

    <!-- Caminho Alternativo Rejeição -->
    <rect x="200" y="345" width="620" height="55" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5,3"/>
    <text x="510" y="365" text-anchor="middle" font-weight="bold" fill="#991b1b">[Alternativa: Cliente Rejeita o Orçamento — POST /public/ordens-servico/{id}/rejeitar]</text>
    <text x="510" y="385" text-anchor="middle" fill="#b91c1c">os.rejeitar() transiciona para CANCELADA mantendo 100% do saldo de estoque intacto</text>

    <!-- Finalização e Entrega -->
    <line x1="90" y1="435" x2="292" y2="435" stroke="#0f172a" stroke-width="1.5" marker-end="url(#seq-arr2)"/>
    <text x="191" y="429" text-anchor="middle" font-weight="bold">8. POST /api/v1/ordens-servico/{id}/finalizar (Mecânico)</text>
    <line x1="297" y1="455" x2="790" y2="455" stroke="#0f172a" stroke-width="1.5" marker-end="url(#seq-arr2)"/>
    <text x="543" y="449" text-anchor="middle" font-weight="bold" fill="#15803d">9. os.finalizar() [Status = FINALIZADA, grava dataFinalizacao p/ cálculo SLA]</text>

    <line x1="90" y1="495" x2="292" y2="495" stroke="#0f172a" stroke-width="1.5" marker-end="url(#seq-arr2)"/>
    <text x="191" y="489" text-anchor="middle" font-weight="bold">10. POST /api/v1/ordens-servico/{id}/entregar (Atendente)</text>
    <line x1="297" y1="515" x2="790" y2="515" stroke="#0f172a" stroke-width="1.5" marker-end="url(#seq-arr2)"/>
    <text x="543" y="509" text-anchor="middle" font-weight="bold" fill="#0f172a">11. os.entregar() [Status = ENTREGUE, grava dataEntrega]</text>
  </g>
</svg>