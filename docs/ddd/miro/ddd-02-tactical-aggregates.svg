<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="100%" height="100%" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="comp" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <polygon points="0 5, 6 0, 12 5, 6 10" fill="#0f172a"/>
    </marker>
    <marker id="dep" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1280" height="820" fill="#f8fafc" rx="10"/>
  <text x="640" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Diagrama Tático DDD — Agregados, Entidades Internas e Value Objects</text>
  <text x="640" y="56" text-anchor="middle" font-size="12.5" fill="#475569">Pacote br.com.fiap.soat.oficina.domain (Java 21 Puro — Zero Dependências de Frameworks)</text>

  <!-- Aggregate Root: OrdemServico -->
  <rect x="420" y="75" width="440" height="365" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/>
  <rect x="420" y="75" width="440" height="45" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="640" y="94" text-anchor="middle" font-size="11" font-style="italic" fill="#92400e">&lt;&lt;Aggregate Root&gt;&gt;</text>
  <text x="640" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350f">OrdemServico</text>
  <text x="435" y="136" font-size="11" font-family="Consolas, monospace" fill="#1e293b">- id: UUID | clienteId: UUID | veiculoId: UUID</text>
  <text x="435" y="153" font-size="11" font-family="Consolas, monospace" fill="#1e293b">- status: StatusOS</text>
  <text x="435" y="170" font-size="11" font-family="Consolas, monospace" fill="#1e293b">- descricaoProblema: String | diagnostico: String</text>
  <text x="435" y="187" font-size="11" font-family="Consolas, monospace" fill="#1e293b">- itensServico: List&lt;ItemServicoOrdem&gt;</text>
  <text x="435" y="204" font-size="11" font-family="Consolas, monospace" fill="#1e293b">- itensPeca: List&lt;ItemPecaOrdem&gt;</text>
  <text x="435" y="221" font-size="11" font-family="Consolas, monospace" fill="#1e293b">- dataAbertura, dataAprovacao, dataFinalizacao, dataEntrega: LocalDateTime</text>
  <line x1="420" y1="232" x2="860" y2="232" stroke="#d97706" stroke-width="1.5"/>
  <text x="435" y="252" font-size="11" font-family="Consolas, monospace" fill="#0f172a">+ abrir(clienteId, veiculoId, descricaoProblema): OrdemServico</text>
  <text x="435" y="269" font-size="11" font-family="Consolas, monospace" fill="#0f172a">+ iniciarDiagnostico(): void | + registrarDiagnostico(laudo): void</text>
  <text x="435" y="286" font-size="11" font-family="Consolas, monospace" fill="#0f172a">+ adicionarItemServico(item): void | + removerItemServico(id): void</text>
  <text x="435" y="303" font-size="11" font-family="Consolas, monospace" fill="#0f172a">+ adicionarItemPeca(item): void | + removerItemPeca(id): void</text>
  <text x="435" y="320" font-size="11" font-family="Consolas, monospace" fill="#0f172a">+ aguardarAprovacao(): void | + aprovar(): void | + rejeitar(): void</text>
  <text x="435" y="337" font-size="11" font-family="Consolas, monospace" fill="#0f172a">+ finalizar(): void | + entregar(): void | + cancelar(): void</text>
  <text x="435" y="354" font-size="11" font-family="Consolas, monospace" fill="#0f172a">+ calcularValorTotal(): Dinheiro</text>
  <text x="435" y="371" font-size="11" font-family="Consolas, monospace" fill="#0f172a">+ calcularTotalServicos(): Dinheiro | + calcularTotalPecas(): Dinheiro</text>
  <text x="435" y="388" font-size="11" font-family="Consolas, monospace" fill="#0f172a">+ calcularTempoExecucaoEmMinutos(): OptionalLong</text>

  <!-- Internal Entity: ItemServicoOrdem -->
  <rect x="40" y="80" width="310" height="150" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <rect x="40" y="80" width="310" height="40" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="195" y="96" text-anchor="middle" font-size="10.5" font-style="italic" fill="#0369a1">&lt;&lt;Internal Entity&gt;&gt;</text>
  <text x="195" y="113" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0c4a6e">ItemServicoOrdem</text>
  <text x="52" y="138" font-size="11" font-family="Consolas, monospace" fill="#1e293b">- id: UUID | descricao: String</text>
  <text x="52" y="155" font-size="11" font-family="Consolas, monospace" fill="#1e293b">- quantidade: Integer</text>
  <text x="52" y="172" font-size="11" font-family="Consolas, monospace" fill="#1e293b">- valorUnitario: Dinheiro</text>
  <line x1="40" y1="182" x2="350" y2="182" stroke="#0284c7" stroke-width="1"/>
  <text x="52" y="202" font-size="11" font-family="Consolas, monospace" fill="#0f172a">+ criar(desc, qtd, valor): ItemServicoOrdem</text>
  <text x="52" y="218" font-size="11" font-family="Consolas, monospace" fill="#0f172a">+ calcularSubtotal(): Dinheiro</text>

  <!-- Internal Entity: ItemPecaOrdem -->
  <rect x="40" y="265" width="310" height="165" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <rect x="40" y="265" width="310" height="40" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="195" y="281" text-anchor="middle" font-size="10.5" font-style="italic" fill="#0369a1">&lt;&lt;Internal Entity&gt;&gt;</text>
  <text x="195" y="298" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0c4a6e">ItemPecaOrdem</text>
  <text x="52" y="322" font-size="11" font-family="Consolas, monospace" fill="#1e293b">- id: UUID | pecaId: UUID</text>
  <text x="52" y="339" font-size="11" font-family="Consolas, monospace" fill="#1e293b">- nomePeca: String | quantidade: Integer</text>
  <text x="52" y="356" font-size="11" font-family="Consolas, monospace" fill="#1e293b">- valorUnitario: Dinheiro</text>
  <line x1="40" y1="366" x2="350" y2="366" stroke="#0284c7" stroke-width="1"/>
  <text x="52" y="386" font-size="11" font-family="Consolas, monospace" fill="#0f172a">+ criar(pecaId, nome, qtd, val): ItemPeca</text>
  <text x="52" y="403" font-size="11" font-family="Consolas, monospace" fill="#0f172a">+ calcularSubtotal(): Dinheiro</text>

  <!-- Value Object: StatusOS -->
  <rect x="930" y="80" width="310" height="190" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="930" y="80" width="310" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1085" y="96" text-anchor="middle" font-size="10.5" font-style="italic" fill="#166534">&lt;&lt;Value Object / Enum&gt;&gt;</text>
  <text x="1085" y="113" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532d">StatusOS</text>
  <text x="945" y="136" font-size="11" font-family="Consolas, monospace" fill="#1e293b">RECEBIDA | EM_DIAGNOSTICO</text>
  <text x="945" y="153" font-size="11" font-family="Consolas, monospace" fill="#1e293b">AGUARDANDO_APROVACAO | EM_EXECUCAO</text>
  <text x="945" y="170" font-size="11" font-family="Consolas, monospace" fill="#1e293b">FINALIZADA | ENTREGUE | CANCELADA</text>
  <line x1="930" y1="182" x2="1240" y2="182" stroke="#16a34a" stroke-width="1"/>
  <text x="945" y="202" font-size="11" font-family="Consolas, monospace" fill="#0f172a">+ podeTransicionarPara(destino): boolean</text>
  <text x="945" y="219" font-size="11" font-family="Consolas, monospace" fill="#0f172a">+ permiteEdicaoItens(): boolean</text>

  <!-- Value Object: Dinheiro -->
  <rect x="930" y="295" width="310" height="145" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="930" y="295" width="310" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1085" y="311" text-anchor="middle" font-size="10.5" font-style="italic" fill="#166534">&lt;&lt;Value Object (Record)&gt;&gt;</text>
  <text x="1085" y="328" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532d">Dinheiro</text>
  <text x="945" y="352" font-size="11" font-family="Consolas, monospace" fill="#1e293b">+ valor: BigDecimal (scale=2, HALF_UP)</text>
  <line x1="930" y1="364" x2="1240" y2="364" stroke="#16a34a" stroke-width="1"/>
  <text x="945" y="384" font-size="11" font-family="Consolas, monospace" fill="#0f172a">+ somar(Dinheiro outro): Dinheiro</text>
  <text x="945" y="401" font-size="11" font-family="Consolas, monospace" fill="#0f172a">+ multiplicar(int fator): Dinheiro</text>

  <!-- Aggregate Root: Cliente -->
  <rect x="40" y="490" width="280" height="175" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="40" y="490" width="280" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="180" y="506" text-anchor="middle" font-size="10.5" font-style="italic" fill="#92400e">&lt;&lt;Aggregate Root&gt;&gt;</text>
  <text x="180" y="523" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#78350f">Cliente</text>
  <text x="52" y="547" font-size="11" font-family="Consolas, monospace" fill="#1e293b">- id: UUID | nome: String</text>
  <text x="52" y="564" font-size="11" font-family="Consolas, monospace" fill="#1e293b">- cpfCnpj: CpfCnpj</text>
  <text x="52" y="581" font-size="11" font-family="Consolas, monospace" fill="#1e293b">- telefone: String | email: String</text>
  <line x1="40" y1="592" x2="320" y2="592" stroke="#d97706" stroke-width="1"/>
  <text x="52" y="612" font-size="11" font-family="Consolas, monospace" fill="#0f172a">+ criar(nome, doc, tel, email): Cliente</text>
  <text x="52" y="629" font-size="11" font-family="Consolas, monospace" fill="#0f172a">+ atualizar(nome, tel, email): void</text>

  <!-- Aggregate Root: Veiculo -->
  <rect x="350" y="490" width="280" height="175" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="350" y="490" width="280" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="490" y="506" text-anchor="middle" font-size="10.5" font-style="italic" fill="#92400e">&lt;&lt;Aggregate Root&gt;&gt;</text>
  <text x="490" y="523" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#78350f">Veiculo</text>
  <text x="362" y="547" font-size="11" font-family="Consolas, monospace" fill="#1e293b">- id: UUID | clienteId: UUID</text>
  <text x="362" y="564" font-size="11" font-family="Consolas, monospace" fill="#1e293b">- placa: Placa | marca, modelo: String</text>
  <text x="362" y="581" font-size="11" font-family="Consolas, monospace" fill="#1e293b">- anoFab, anoMod, quilometragem: Integer</text>
  <line x1="350" y1="592" x2="630" y2="592" stroke="#d97706" stroke-width="1"/>
  <text x="362" y="612" font-size="11" font-family="Consolas, monospace" fill="#0f172a">+ atualizarCadastro(...): void</text>
  <text x="362" y="629" font-size="11" font-family="Consolas, monospace" fill="#0f172a">+ atualizarQuilometragem(km): void</text>

  <!-- Aggregate Root: Peca -->
  <rect x="660" y="490" width="280" height="175" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="660" y="490" width="280" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="800" y="506" text-anchor="middle" font-size="10.5" font-style="italic" fill="#92400e">&lt;&lt;Aggregate Root&gt;&gt;</text>
  <text x="800" y="523" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#78350f">Peca</text>
  <text x="672" y="547" font-size="11" font-family="Consolas, monospace" fill="#1e293b">- id: UUID | codigo: String (SKU)</text>
  <text x="672" y="564" font-size="11" font-family="Consolas, monospace" fill="#1e293b">- precoUnitario: Dinheiro</text>
  <text x="672" y="581" font-size="11" font-family="Consolas, monospace" fill="#1e293b">- saldoEstoque, estoqueMinimo: Integer</text>
  <line x1="660" y1="592" x2="940" y2="592" stroke="#d97706" stroke-width="1"/>
  <text x="672" y="612" font-size="11" font-family="Consolas, monospace" fill="#0f172a">+ debitarEstoque(qtd): void</text>
  <text x="672" y="629" font-size="11" font-family="Consolas, monospace" fill="#0f172a">+ creditarEstoque(qtd): void</text>
  <text x="672" y="646" font-size="11" font-family="Consolas, monospace" fill="#0f172a">+ abaixoDoEstoqueMinimo(): boolean</text>

  <!-- Aggregate Root: Servico -->
  <rect x="970" y="490" width="270" height="175" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="970" y="490" width="270" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="1105" y="506" text-anchor="middle" font-size="10.5" font-style="italic" fill="#92400e">&lt;&lt;Aggregate Root&gt;&gt;</text>
  <text x="1105" y="523" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#78350f">Servico</text>
  <text x="982" y="547" font-size="11" font-family="Consolas, monospace" fill="#1e293b">- id: UUID | codigo: String</text>
  <text x="982" y="564" font-size="11" font-family="Consolas, monospace" fill="#1e293b">- nome, descricao: String</text>
  <text x="982" y="581" font-size="11" font-family="Consolas, monospace" fill="#1e293b">- precoPadrao: Dinheiro | tempoMin: Int</text>
  <line x1="970" y1="592" x2="1240" y2="592" stroke="#d97706" stroke-width="1"/>
  <text x="982" y="612" font-size="11" font-family="Consolas, monospace" fill="#0f172a">+ criar(cod, nome, preco...): Servico</text>
  <text x="982" y="629" font-size="11" font-family="Consolas, monospace" fill="#0f172a">+ atualizar(nome, desc, preco): void</text>

  <!-- VOs: CpfCnpj & Placa -->
  <rect x="40" y="700" width="280" height="95" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="180" y="722" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">&lt;&lt;Value Object&gt;&gt; CpfCnpj</text>
  <text x="180" y="742" text-anchor="middle" font-size="10.5" font-family="Consolas, monospace" fill="#1e293b">+ valor: String (11 ou 14 dígitos)</text>
  <text x="180" y="760" text-anchor="middle" font-size="10.5" font-family="Consolas, monospace" fill="#1e293b">+ isCpf() / isCnpj() / formatado()</text>

  <rect x="350" y="700" width="280" height="95" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="490" y="722" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">&lt;&lt;Value Object&gt;&gt; Placa</text>
  <text x="490" y="742" text-anchor="middle" font-size="10.5" font-family="Consolas, monospace" fill="#1e293b">+ valor: String (ABC1234 / ABC1D23)</text>
  <text x="490" y="760" text-anchor="middle" font-size="10.5" font-family="Consolas, monospace" fill="#1e293b">+ isMercosul(): boolean</text>

  <!-- Connectors -->
  <line x1="420" y1="155" x2="350" y2="155" stroke="#0f172a" stroke-width="2"/>
  <text x="385" y="148" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">1..*</text>
  <line x1="420" y1="340" x2="350" y2="340" stroke="#0f172a" stroke-width="2"/>
  <text x="385" y="333" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">1..*</text>
  <line x1="860" y1="175" x2="930" y2="175" stroke="#0f172a" stroke-width="2" marker-end="url(#dep)"/>
  <line x1="860" y1="360" x2="930" y2="360" stroke="#0f172a" stroke-width="2" marker-end="url(#dep)"/>
  <line x1="180" y1="665" x2="180" y2="700" stroke="#16a34a" stroke-width="2" marker-end="url(#dep)"/>
  <line x1="490" y1="665" x2="490" y2="700" stroke="#16a34a" stroke-width="2" marker-end="url(#dep)"/>
</svg>